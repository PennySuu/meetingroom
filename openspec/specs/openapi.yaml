openapi: 3.0.3
info:
  title: 会议室预约平台 API
  version: "1.0.0"
  description: |
    MVP REST 契约（契约驱动 / API-first）。

    ## 全局约定
    - **Base path**：`/v1`
    - **统一 envelope**：成功 `success=true`；失败 `success=false`，`message` 为用户可读文案。
    - **请求头**：`Content-Type: application/json`（除另有说明）；`X-Request-ID`（UUID）；写操作按需 `X-CSRF-Token`（Cookie 会话与 CSRF 策略启用时）。
    - **会话**：推荐使用 **HTTPOnly Cookie**（具体 Cookie 名由服务端配置）；跨域时需与前端 `withCredentials` 对齐。

    ## 访客可读与安全
    - **`GET /v1/rooms`、`GET /v1/rooms/{roomId}`、`GET /v1/rooms/{roomId}/calendar`**：无需登录；响应 **不得** 包含他人用户标识或与预约无关的 PII。
    - **`GET .../calendar`**：每条占用 **仅** `startAt`、`endAt`，**不包含** `title`、`userId`。

    ## 密码传输
    详见 **`GET /v1/auth/password-params`** 与仓库内 **`openspec/specs/README.md`**（formulaVersion=1）。

servers:
  - url: /
    description: 相对路径（由网关/反向代理挂载）

tags:
  - name: auth
    description: 注册、登录、退出、密码参数
  - name: rooms
    description: 会议室（预置数据）
  - name: bookings
    description: 预约创建、我的预约、取消

paths:
  /v1/auth/password-params:
    get:
      tags: [auth]
      summary: 获取密码客户端预哈希参数
      description: |
        返回 **`pepper`** 与 **`formulaVersion`**。客户端据此计算 **`passwordPrehash`**（SHA-256，详见 README）。

        该接口可 **匿名** 调用；响应可短时缓存（建议同一客户端 ≤ 5 分钟）。
      operationId: getPasswordParams
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_PasswordParams"
        "429":
          description: 限流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/auth/register:
    post:
      tags: [auth]
      summary: 用户注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 创建成功（通常同时建立会话，Set-Cookie）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_UserSnapshot"
        "409":
          description: 用户名已占用（`code: USER_USERNAME_CONFLICT`，可与登录防枚举策略并存）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: |
        **速率限制**：实现上必须严于普通读接口（推荐：每 IP 每分钟 ≤ 5 次，可按用户名叠加维度）；超限返回 **429**，`code: RATE_LIMIT_EXCEEDED`，且带 **Retry-After**（秒）。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 成功（Set-Cookie）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_UserSnapshot"
        "401":
          description: 认证失败（防枚举：不明示用户存在性）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "429":
          description: 登录限流
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      operationId: logout
      security:
        - cookieSession: []
      responses:
        "200":
          description: 成功（统一 envelope；`data` 可为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_Empty"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/rooms:
    get:
      tags: [rooms]
      summary: 会议室列表
      operationId: listRooms
      parameters:
        - $ref: "#/components/parameters/CapacityGte"
        - $ref: "#/components/parameters/Amenity"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_RoomList"

  /v1/rooms/{roomId}:
    get:
      tags: [rooms]
      summary: 会议室详情
      operationId: getRoom
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_Room"
        "404":
          description: 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/rooms/{roomId}/calendar:
    get:
      tags: [rooms]
      summary: 查询某会议室在某业务日的占用片段
      description: |
        **鉴权**：可选；访客可访问。

        **隐私**：返回体中每条占用 **仅包含** `startAt` 与 `endAt`，**禁止**返回他人会议主题或用户标识字段。
      operationId: getRoomCalendar
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: date
          in: query
          required: true
          description: 业务日历日（YYYY-MM-DD），按 `timeZone` 解释。
          schema:
            type: string
            format: date
            example: "2026-04-22"
        - name: timeZone
          in: query
          required: false
          description: IANA 时区 ID；缺省 **`Asia/Shanghai`**。
          schema:
            type: string
            example: Asia/Shanghai
      responses:
        "200":
          description: OK；无占用时 `items` 为空数组。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_OccupiedSlots"
        "404":
          description: 会议室不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: 日期或时区非法等
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/bookings:
    post:
      tags: [bookings]
      summary: 创建预约
      operationId: createBooking
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_Booking"
        "401":
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: 会议室冲突或用户跨会议室冲突（见 data 载荷）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope_BookingConflict"
        "422":
          description: 业务校验失败（过去时间、超 4 小时、跨日等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "429":
          description: 限流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/bookings/mine:
    get:
      tags: [bookings]
      summary: 我的预约（分页）
      operationId: listMyBookings
      security:
        - cookieSession: []
      parameters:
        - name: roomId
          in: query
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          description: 筛选起始业务日（含），YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: 筛选结束业务日（含），YYYY-MM-DD。
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_BookingPage"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

  /v1/bookings/{bookingId}/cancel:
    post:
      tags: [bookings]
      summary: 取消本人未开始的预约
      operationId: cancelBooking
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: OK（返回更新后的预约或状态摘要）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope_Booking"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: 非本人或不可取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: 预约不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: 已开始/已结束等不可取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: MR_SESSION
      description: |
        会话 Cookie 名称可由部署配置覆盖；文档以 **`MR_SESSION`** 为示例名。

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Sort:
      name: sort
      in: query
      description: 例：`startAt,desc`
      schema:
        type: string
        default: "startAt,desc"
    CapacityGte:
      name: capacityGte
      in: query
      description: 最小容纳人数（含）。
      schema:
        type: integer
        minimum: 1
    Amenity:
      name: amenity
      in: query
      description: |
        设施标签多选：**同一键重复**，例如 `amenity=projector&amenity=whiteboard`（`style=form` + `explode=true`）。
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 创建预约必填；24h TTL 内相同 key 返回同一业务结果。
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Cookie 会话场景下，写操作需携带（若启用 CSRF）。

  schemas:
    ErrorCode:
      type: string
      description: 业务错误码（节选；实现可扩展须在变更中评审）
      enum:
        - SUCCESS
        - AUTH_UNAUTHORIZED
        - AUTH_TOKEN_EXPIRED
        - USER_NOT_FOUND
        - USER_USERNAME_CONFLICT
        - ROOM_NOT_FOUND
        - RESOURCE_NOT_FOUND
        - BOOKING_NOT_FOUND
        - BOOKING_CONFLICT_ROOM
        - BOOKING_CONFLICT_USER
        - BOOKING_CANNOT_CANCEL
        - VALIDATION_FAILED
        - PERMISSION_DENIED
        - RATE_LIMIT_EXCEEDED
        - OPERATION_FAILED

    ApiSuccessEnvelope_PasswordParams:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
          example: SUCCESS
        message:
          type: string
        data:
          $ref: "#/components/schemas/PasswordParamsDTO"

    PasswordParamsDTO:
      type: object
      required: [pepper, formulaVersion]
      properties:
        pepper:
          type: string
          description: 与明文口令组合参与 SHA-256（详见 README）。
        formulaVersion:
          type: integer
          description: 当前恒为 **1**。
          enum: [1]

    RegisterRequest:
      type: object
      required: [username, passwordPrehash]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        passwordPrehash:
          type: string
          description: formulaVersion=1 下为 64 位小写十六进制 SHA-256 输出。
          pattern: "^[0-9a-f]{64}$"
        displayName:
          type: string
          maxLength: 64

    LoginRequest:
      type: object
      required: [username, passwordPrehash]
      properties:
        username:
          type: string
        passwordPrehash:
          type: string
          pattern: "^[0-9a-f]{64}$"

    UserSnapshot:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true

    ApiSuccessEnvelope_UserSnapshot:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
          example: SUCCESS
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserSnapshot"

    ApiSuccessEnvelope_Empty:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
        message:
          type: string
        data:
          type: object
          nullable: true

    RoomDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string
        capacity:
          type: integer
        amenities:
          type: array
          items:
            type: string

    ApiSuccessEnvelope_RoomList:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoomDTO"

    ApiSuccessEnvelope_Room:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/RoomDTO"

    OccupiedSlot:
      type: object
      description: 访客可见；**不得**扩展用户相关字段。
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time

    ApiSuccessEnvelope_OccupiedSlots:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
        message:
          type: string
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OccupiedSlot"

    CreateBookingRequest:
      type: object
      required: [roomId, startAt, endAt, title]
      properties:
        roomId:
          type: integer
          format: int64
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 200

    BookingDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        title:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, CANCELLED]

    ApiSuccessEnvelope_Booking:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/BookingDTO"

    PageBooking:
      type: object
      required: [page, size, total, items]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingDTO"

    ApiSuccessEnvelope_BookingPage:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageBooking"

    ApiErrorEnvelope:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          nullable: true
          description: 可选错误细节；具体形状随 `code` 变化。

    ConflictingRoom:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    BookingConflictUserData:
      type: object
      required: [conflictingRoom]
      properties:
        conflictingRoom:
          $ref: "#/components/schemas/ConflictingRoom"

    BookingConflictRoomData:
      type: object
      description: 无须额外字段时常为空对象。
      properties: {}

    ApiErrorEnvelope_BookingConflict:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
          enum: [BOOKING_CONFLICT_ROOM, BOOKING_CONFLICT_USER]
        message:
          type: string
        data:
          oneOf:
            - $ref: "#/components/schemas/BookingConflictUserData"
            - $ref: "#/components/schemas/BookingConflictRoomData"
          nullable: true
